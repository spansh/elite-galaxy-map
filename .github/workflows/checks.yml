# Lints, tests and builds every push and pull request, on both Node.js
# lines currently supported: 24 (maintenance LTS) and 26 (LTS).
name: Checks

on:
    push:
    pull_request:

# Read the code; nothing more.
permissions:
    contents: read

# A newer push to the same branch replaces a run still going.
concurrency:
    group: checks-${{ github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        name: Node.js ${{ matrix.node-version }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: [24, 26]
        steps:
            - uses: actions/checkout@v6
            # Installs the pnpm version named by packageManager in package.json.
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: pnpm
            # Fails if pnpm-lock.yaml doesn't match package.json, rather than
            # quietly updating it.
            - run: pnpm install --frozen-lockfile
            - run: pnpm run lint
            - run: pnpm test
            - run: pnpm run build
